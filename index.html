<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papelería y Artículos de Oficina</title>
    <style>
        /* Estilos generales para centrar y dar formato */
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* Contenedor principal de la sección Hero */
        .hero-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 20px;
            background-color: #f8f9fa; /* Fondo claro, puedes cambiarlo por una imagen */
            min-height: 400px;
        }

        /* Subtítulo */
        .hero-subtagline {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 10px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Título principal */
        .hero-tagline {
            font-size: 3.5rem;
            color: #111;
            margin: 0 0 30px 0;
            font-weight: 700;
            line-height: 1.2;
            max-width: 800px;
        }

        /* Botón de llamada a la acción */
        .hero-btn {
            background-color: #000; /* Botón de alto contraste */
            color: #fff;
            padding: 15px 35px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 4px; /* Bordes ligeramente redondeados */
            border: 2px solid #000;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .hero-btn:hover {
            background-color: #fff;
            color: #000;
        }

        /* Adaptación para pantallas pequeñas (celulares) */
        @media (max-width: 768px) {
            .hero-tagline {
                font-size: 2.5rem;
            }
            .hero-subtagline {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Estructura HTML de tu sección -->
    <section class="hero-section">
        <p class="hero-subtagline">Surtido para tu oficina y proyectos creativos</p>
        <h1 class="hero-tagline">Papelería y Artículos de Oficina</h1>
        <a href="#productos" class="hero-btn">Explora nuestros productos</a>
    </section>

</body>
</html>
